[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "three-dried-unfolding"
version = "0.1.0"
description = "Physics-based 3DRIED reconstruction baselines"
requires-python = ">=3.8"
dependencies = [
  "h5py>=3.7",
  "matplotlib>=3.6",
  "numpy>=1.23",
  "PyYAML>=6.0",
  "scipy>=1.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

