# Same physical geometry/carrier as the accepted 3DRIED acquisition.
acquisition_config: configs/baseline_3dried.yaml
model: independent_single_frequency_spherical_phase_only
representative_matlab_bin: 17
sampling:
  pattern: height_lines
  rates: [1.0, 0.7, 0.5, 0.2]
  seed: 20261024
timing:
  cpu_fft_workers: 1
  warmup: 2
  repetitions: 10
  dtype: complex128
  device: cuda:0
scenes:
  single:
    - {x_m: -0.05, z_m: 0.12, amplitude: 1.0, phase_rad: 0.4}
  five:
    - {x_m: -0.10, z_m: 0.05, amplitude: 1.0, phase_rad: 0.0}
    - {x_m: -0.05, z_m: 0.12, amplitude: 1.0, phase_rad: 0.4}
    - {x_m: 0.03, z_m: 0.20, amplitude: 0.8, phase_rad: -0.6}
    - {x_m: -0.13, z_m: 0.24, amplitude: 0.7, phase_rad: 1.2}
    - {x_m: 0.05, z_m: 0.06, amplitude: 0.9, phase_rad: -1.0}
# All five targets are at the same depth for this single-slice experiment.
# No range FFT, raw FMCW simulation, noise, 1/R weight, or amplitude fitting.
