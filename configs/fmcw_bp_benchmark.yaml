acquisition_config: configs/baseline_3dried.yaml
model: positive_beat_stop_and_go_fmcw
# Synthetic definition, not a calibration claim for Hammer's ADC timing.
adc_first_sample_frequency_hz: 77000000000.0
reference_depth_matlab_bin: 17
range_fft_oversampling: 8
range_window: rectangular
interpolation: complex_linear_after_fast_time_centering
phase_correction: exact_carrier_and_quadratic_rvp_for_declared_if
sampling:
  pattern: height_lines
  rates: [1.0, 0.7, 0.5, 0.2]
  seed: 20261024
timing:
  device: cuda:0
  warmup: 2
  repetitions: 5
  precisions: [double, mixed]
  mixed_relative_error_limit: 0.001
scenes:
  single:
    - {x_m: -0.05, z_m: 0.12, amplitude: 1.0, phase_rad: 0.4}
  five:
    - {x_m: -0.10, z_m: 0.05, amplitude: 1.0, phase_rad: 0.0}
    - {x_m: -0.05, z_m: 0.12, amplitude: 1.0, phase_rad: 0.4}
    - {x_m: 0.03, z_m: 0.20, amplitude: 0.8, phase_rad: -0.6}
    - {x_m: -0.13, z_m: 0.24, amplitude: 0.7, phase_rad: 1.2}
    - {x_m: 0.05, z_m: 0.06, amplitude: 0.9, phase_rad: -1.0}
# Raw IF has 256 complex ADC samples at every retained aperture position.
# All five targets share the chosen output depth; full distance profiles are
# retained and queried by actual slant range, not by one fixed FFT bin.
